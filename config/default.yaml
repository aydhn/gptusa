# We just add a basic YAML file, but let's assume it has everything needed for the project.
release:
  enabled: true
  release_name: "usa_signal_bot_local"
  output_dir: "data/release/builds"
  include_docs: true
  include_tests: true
  include_reports: true
  include_data_cache: false
  include_backups: false
  include_secrets: false
  validate_after_build: true
  write_release_reports: true
  warn_not_live_approval: true
  warn_not_investment_advice: true

release_artifacts:
  enabled: true
  include_source: true
  include_config_examples: true
  include_docs: true
  include_tests: true
  include_requirements: true
  include_latest_regression_report: true
  include_latest_quality_report: true
  exclude_git: true
  exclude_pycache: true
  exclude_env_files: true
  exclude_secret_like_paths: true

operator_runbook:
  enabled: true
  write_runbook: true
  include_command_reference: true
  include_safety_limitations: true
  include_troubleshooting: true
  warn_not_investment_advice: true
  warn_no_broker_execution: true

maintenance:
  enabled: true
  daily_enabled: true
  weekly_enabled: true
  monthly_enabled: true
  pre_release_enabled: true
  execute_commands: false
  command_timeout_seconds: 60
  write_maintenance_reports: true

backup:
  enabled: true
  output_dir: "data/release/backups"
  default_scope: "reports_only"
  include_configs: true
  include_reports: true
  include_data_cache: false
  include_secrets: false
  validate_after_backup: true
  restore_dry_run_only: true

config_profiles:
  enabled: true
  write_default_profiles: true
  profiles_dir: "config/profiles"
  require_broker_flags_false: true
  require_telegram_real_send_false: true
  require_no_dashboard: true

upgrade_precheck:
  enabled: true
  check_python_version: true
  check_requirements: true
  check_config_files: true
  check_data_directories: true
  check_secret_like_files: true
  check_regression_smoke: true
  write_precheck_reports: true
