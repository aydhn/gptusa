incident_response:
  enabled: true
  store_dir: "data/incident"
  auto_collect_from_latest_artifacts: true
  minimum_severity_to_report: "medium"
  write_incident_reports: true
  redact_sensitive_data: true
  warn_local_only: true
  warn_not_investment_advice: true
  warn_no_broker_execution: true

recovery:
  enabled: true
  dry_run_default: true
  execute_commands_default: false
  allow_destructive_actions: false
  require_manual_review_for_critical: true
  write_recovery_plans: true
  write_recovery_results: true
  block_on_safety_violation: true

rollback:
  enabled: true
  dry_run_default: true
  execute_enabled: false
  allow_overwrite_default: false
  require_force: true
  protect_source_code: true
  protect_config: true
  protect_docs: true
  protect_tests: true
  protect_secrets: true
  inspect_zip_only_by_default: true
  write_rollback_plans: true
  write_rollback_results: true
  write_rollback_prechecks: true

rollback_sources:
  enabled: true
  include_release_bundles: true
  include_backup_archives: true
  include_config_profiles: true
  include_regression_baselines: true
  prefer_latest_valid_source: true

incident_audit:
  enabled: true
  audit_path: "data/incident/audit/incident_audit.jsonl"
  redact_sensitive_paths: true
  append_only: true

incident_notifications:
  enabled: true
  dry_run: true
  notify_incident_report: true
  notify_recovery_plan: true
  notify_rollback_dry_run: true
  default_channel: "dry_run"
  warn_no_real_send_default: true

scheduler:
  enabled: true
  store_dir: "data/scheduler"
  dry_run_default: true
  execute_commands_default: false
  install_daemon: false
  install_cron: false
  install_service: false
  allow_destructive_jobs: false
  write_scheduler_reports: true
  warn_local_only: true
  warn_not_investment_advice: true
  warn_no_broker_execution: true

run_locks:
  enabled: true
  locks_dir: "data/scheduler/locks"
  stale_after_seconds_default: 3600
  global_stale_after_seconds: 7200
  acquisition_mode_default: "FAIL_FAST"
  allow_steal_if_stale: true
  cleanup_stale_locks_dry_run_default: true
  write_lock_audit: true

concurrency:
  enabled: true
  global_max_concurrent_runs: 1
  scan_max_concurrent_runs: 1
  backtest_max_concurrent_runs: 1
  paper_max_concurrent_runs: 1
  regression_max_concurrent_runs: 1
  retention_max_concurrent_runs: 1
  observability_max_concurrent_runs: 2
  notification_max_concurrent_runs: 1
  block_on_conflict: true
  allow_overlap_default: false

idempotency:
  enabled: true
  store_path: "data/scheduler/idempotency.jsonl"
  duplicate_policy: "SKIP"
  record_completed_runs: true
  prune_after_days: 30
  prune_dry_run_default: true

atomic_io:
  enabled: true
  use_atomic_writes: true
  temp_suffix: ".tmp"
  verify_checksum_after_write: true
  block_protected_target_write: false

scheduler_jobs:
  enabled: true
  default_dry_run: true
  execute_commands: false
  safe_allowlist_only: true
  blocked_commands:
    - "cleanup-execute"
    - "rollback-execute"
    - "send-broker-order"
    - "live-order"
    - "demo-order"

scheduler_notifications:
  enabled: true
  dry_run: true
  notify_scheduler_report: true
  notify_stale_lock_warning: true
  notify_concurrency_blocked: true
  default_channel: "DRY_RUN"
  warn_no_real_send_default: true
