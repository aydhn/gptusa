paper_shadow:
  enabled: true
  default_runtime_mode: "full_paper_shadow"
  write_shadow_reports: true
  warn_not_investment_advice: true
  warn_no_broker_execution: true
  warn_no_real_paper_mutation: true
  warn_shadow_orders_are_not_orders: true
  warn_shadow_fills_are_simulated: true

shadow_simulation:
  enabled: true
  starting_equity_usd: 100000.0
  deterministic_simulation: true
  use_mock_signals_by_default: true
  allow_real_orders: false
  allow_broker_calls: false
  allow_paper_state_mutation: false
  allow_telegram_real_send: false
  allow_production_config_write: false

shadow_order_intents:
  enabled: true
  default_notional_usd: 1000.0
  max_notional_pct_equity_warning: 5.0
  block_real_order_like_fields: true
  broker_destination_must_be_null: true

shadow_fill_simulation:
  enabled: true
  default_fill_price: 100.0
  default_slippage_bps: 10.0
  default_cost_bps: 5.0
  deterministic_fills: true
  real_fill_forbidden: true

shadow_ledger:
  enabled: true
  write_ledger_events: true
  require_session_started_event: true
  require_session_completed_event: true
  record_blocked_operations: true

shadow_safety:
  enabled: true
  block_on_real_order_risk: true
  block_on_broker_field_risk: true
  block_on_paper_state_mutation_risk: true
  block_on_telegram_real_send_risk: true
  block_on_production_config_write_risk: true
  block_on_secret_risk: true

paper_shadow_notifications:
  enabled: true
  dry_run: true
  notify_shadow_report: true
  notify_shadow_safety_warning: true
  notify_shadow_rehearsal_warning: true
  default_channel: "dry_run"
  warn_no_real_send_default: true


paper_observer_governance:
  enabled: true
  write_observer_governance_reports: true
  warn_not_investment_advice: true
  warn_no_broker_execution: true
  warn_no_real_paper_mutation: true
  warn_governance_is_non_executing: true
  warn_governance_is_not_activation: true

observer_paper_comparison:
  enabled: true
  require_paper_baseline: true
  require_observer_output: true
  max_acceptable_drift_event_count: 10
  block_on_unsafe_drift: true
  block_on_missing_locked_runtime: true

promotion_evidence_refresh:
  enabled: true
  max_evidence_age_days: 14
  require_observer_review: true
  require_observer_comparison: true
  require_controlled_planning_ticket: true
  require_observation_exit_review: true
  request_followup_on_missing_evidence: true
  request_followup_on_stale_evidence: true

observer_governance:
  enabled: true
  conservative_decision_board: true
  eligible_decision_is_dossier_only: true
  require_manual_review: true
  allow_active_paper: false
  allow_broker_execution: false
  allow_paper_state_mutation: false
  allow_config_patch: false

observer_governance_safety:
  enabled: true
  block_on_real_order_risk: true
  block_on_paper_order_risk: true
  block_on_broker_order_risk: true
  block_on_paper_state_mutation_risk: true
  block_on_telegram_real_send_risk: true
  block_on_production_config_write_risk: true
  block_on_active_paper_enable_risk: true
  block_on_observer_unlock_risk: true
  block_on_secret_risk: true

paper_observer_governance_notifications:
  enabled: true
  dry_run: true
  notify_observer_governance_report: true
  notify_observer_evidence_warning: true
  notify_observer_comparison_warning: true
  default_channel: "dry_run"
  warn_no_real_send_default: true
