scheduler:
  enabled: true
  dry_run_default: true
regime_aware_costs:
  enabled: true
  write_regime_cost_reports: true
research_workflow:
  enabled: true
  write_workflow_reports: true
  warn_not_investment_advice: true
  warn_no_broker_execution: true
  warn_no_auto_optimization: true
  warn_experiments_are_plans_only: true
repair_queue:
  enabled: true
  deduplicate_items: true
  auto_triage: true
  critical_severity_priority: CRITICAL
  noisy_evidence_priority: DEFERRED
  max_items_per_review: 200
hypothesis_tracker:
  enabled: true
  require_null_condition: true
  require_success_failure_criteria: true
  min_evidence_refs: 1
  low_sample_confidence: LOW
  no_evidence_confidence: INSUFFICIENT_EVIDENCE
controlled_experiment_planning:
  enabled: true
  allow_auto_execution: false
  require_manual_review: true
  require_baseline_candidate_refs: true
  require_rollback_plan: true
  require_acceptance_gates: true
  max_parameter_changes_per_experiment: 5
research_acceptance_gates:
  enabled: true
  min_sample_size: 30
  require_oos_improvement_gate: true
  require_walk_forward_stability_gate: true
  require_cost_robustness_gate: true
  require_drawdown_gate: true
  require_no_leakage_gate: true
  require_manual_review_gate: true
research_validation_plan:
  enabled: true
  default_holdout_pct: 20.0
  min_walk_forward_windows: 3
  require_oos: true
  require_regime_bucket_review: true
  require_cost_bucket_review: true
research_priority_scoring:
  enabled: true
  severity_weight: 0.4
  evidence_quality_weight: 0.25
  impact_weight: 0.25
  risk_penalty_weight: 0.1
research_notifications:
  enabled: true
  dry_run: true
  notify_workflow_report: true
  notify_repair_queue_warning: true
  notify_experiment_plan_warning: true
  default_channel: dry_run
  warn_no_real_send_default: true


paper_observer_governance:
  enabled: true
  write_observer_governance_reports: true
  warn_not_investment_advice: true
  warn_no_broker_execution: true
  warn_no_real_paper_mutation: true
  warn_governance_is_non_executing: true
  warn_governance_is_not_activation: true

observer_paper_comparison:
  enabled: true
  require_paper_baseline: true
  require_observer_output: true
  max_acceptable_drift_event_count: 10
  block_on_unsafe_drift: true
  block_on_missing_locked_runtime: true

promotion_evidence_refresh:
  enabled: true
  max_evidence_age_days: 14
  require_observer_review: true
  require_observer_comparison: true
  require_controlled_planning_ticket: true
  require_observation_exit_review: true
  request_followup_on_missing_evidence: true
  request_followup_on_stale_evidence: true

observer_governance:
  enabled: true
  conservative_decision_board: true
  eligible_decision_is_dossier_only: true
  require_manual_review: true
  allow_active_paper: false
  allow_broker_execution: false
  allow_paper_state_mutation: false
  allow_config_patch: false

observer_governance_safety:
  enabled: true
  block_on_real_order_risk: true
  block_on_paper_order_risk: true
  block_on_broker_order_risk: true
  block_on_paper_state_mutation_risk: true
  block_on_telegram_real_send_risk: true
  block_on_production_config_write_risk: true
  block_on_active_paper_enable_risk: true
  block_on_observer_unlock_risk: true
  block_on_secret_risk: true

paper_observer_governance_notifications:
  enabled: true
  dry_run: true
  notify_observer_governance_report: true
  notify_observer_evidence_warning: true
  notify_observer_comparison_warning: true
  default_channel: "dry_run"
  warn_no_real_send_default: true
