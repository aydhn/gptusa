  write_observer_governance_reports: true
  warn_not_investment_advice: true
  warn_no_broker_execution: true
  warn_no_real_paper_mutation: true
  warn_governance_is_non_executing: true
  warn_governance_is_not_activation: true

observer_paper_comparison:
  enabled: true
  require_paper_baseline: true
  require_observer_output: true
  max_acceptable_drift_event_count: 10
  block_on_unsafe_drift: true
  block_on_missing_locked_runtime: true

promotion_evidence_refresh:
